<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - FinStack</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <script src="../../js/app.js"></script>
  <style>
    .notif-tabs { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
    .notif-tab { padding:8px 18px; border-radius:var(--radius-lg); font-size:0.8125rem; font-weight:500; border:1px solid var(--border-default); background:var(--bg-input); color:var(--text-secondary); cursor:pointer; transition:all .2s; }
    .notif-tab:hover { border-color:var(--purple); color:var(--text-primary); }
    .notif-tab.active { background:var(--purple); border-color:var(--purple); color:#fff; }
    .notif-item { display:flex; align-items:flex-start; gap:14px; padding:16px 24px; border-bottom:1px solid var(--border-default); transition:background .15s; cursor:default; }
    .notif-item:last-child { border-bottom:none; }
    .notif-item.unread { background:rgba(124,58,237,.04); }
    .notif-icon-wrap { width:40px; height:40px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .notif-content { flex:1; min-width:0; }
    .notif-title { font-size:0.875rem; font-weight:500; color:var(--text-primary); }
    .notif-body { font-size:0.8125rem; color:var(--text-secondary); margin-top:4px; }
    .notif-meta { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:0.75rem; color:var(--text-muted); }
    .notif-meta .dot-sep { opacity:.5; }
    .notif-actions { display:flex; gap:6px; flex-shrink:0; margin-left:8px; }
    .notif-actions button { width:32px; height:32px; border-radius:var(--radius-md); border:1px solid var(--border-default); background:transparent; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
    .notif-actions button:hover { background:var(--bg-input); color:var(--text-primary); }
    .notif-actions button.del-btn:hover { color:var(--red); border-color:var(--red); }
    .notif-empty { text-align:center; padding:48px 24px; }
    .notif-empty-icon { width:64px; height:64px; border-radius:var(--radius-xl); background:var(--purple-bg); color:var(--purple); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topnav"></header>
  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-text">
          <h1>Notifications <span class="badge badge-purple" id="notif-badge" style="display:none;margin-left:8px;"></span></h1>
          <p>Stay updated on expense activities and alerts</p>
        </div>
        <div style="display:flex;gap:12px;">
          <button class="btn btn-secondary" id="mark-all-btn" onclick="markAllRead()">
            <svg xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Mark All Read
          </button>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="notif-tabs" id="notif-tabs">
        <button class="notif-tab active" data-filter="all" onclick="filterNotifs('all',this)">All</button>
        <button class="notif-tab" data-filter="pending" onclick="filterNotifs('pending',this)">Pending</button>
        <button class="notif-tab" data-filter="high-risk" onclick="filterNotifs('high-risk',this)">High Risk</button>
        <button class="notif-tab" data-filter="approved" onclick="filterNotifs('approved',this)">Approved</button>
        <button class="notif-tab" data-filter="rejected" onclick="filterNotifs('rejected',this)">Rejected</button>
      </div>

      <!-- Notifications List -->
      <div class="card" style="padding:0;overflow:hidden;" id="notif-container">
        <div id="notif-list"></div>
      </div>
    </div>
  </main>

  <script src="../../js/api.js"></script>
  <script src="../../js/state.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/config-manager/dashboard.js"></script>
  <script src="../../js/pages/config-manager/notifications.js"></script>
</body>
</html>

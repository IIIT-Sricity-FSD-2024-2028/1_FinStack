<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - FinStack</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <script src="../../js/app.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topnav"></header>
  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-text">
          <h1>Manage Users</h1>
          <p>View and manage all users in your organization</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('add-user-modal')">Add User</button>
      </div>

      <!-- Filters -->
      <div class="filters-bar">
        <div class="search-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" style="width:18px;height:18px;" width="18px" height="18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" class="form-input has-icon" placeholder="Search users..." id="user-search">
        </div>
        <select class="form-input" style="width:auto;" id="role-filter">
          <option value="all">All Roles</option>
          <option value="EXPENSE_SUBMITTER">Expense Submitter</option>
          <option value="MANAGER">Manager</option>
          <option value="FINANCE_OFFICER">Finance Officer</option>
          <option value="COMPLIANCE_OFFICER">Compliance Officer</option>
          <option value="CONFIGURATION_MANAGER">Configuration Manager</option>
        </select>
        <select class="form-input" style="width:auto;" id="status-filter">
          <option value="all">All Status</option>
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
        </select>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="overflow-x-auto">
          <table class="data-table" id="users-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Roles</th>
                <th>Status</th>
                <th>Manager</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="users-pagination">
          <div class="pagination-info">Showing 1-8 of 8 users</div>
          <div class="pagination-buttons">
            <button class="pagination-btn" data-action="prev" disabled><svg xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px;display:inline;vertical-align:middle;" width="16px" height="16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Previous</button>
            <button class="pagination-btn active" data-page="1">1</button>
            <button class="pagination-btn" data-page="2">2</button>
            <button class="pagination-btn" data-page="3">3</button>
            <button class="pagination-btn" data-action="next">Next <svg xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px;display:inline;vertical-align:middle;" width="16px" height="16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Add User Modal -->
  <div class="modal-overlay" id="add-user-modal">
    <div class="modal-content" style="max-width:600px;">
      <div class="modal-header">
        <h2>Add New User</h2>
        <button class="btn-icon" onclick="closeModal('add-user-modal')"><svg xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;" width="20px" height="20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="modal-body">
        <div id="add-user-error" style="display:none;padding:12px 16px;border-radius:var(--radius-lg);background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;font-size:0.8125rem;margin-bottom:16px;">
          <span id="add-user-error-text"></span>
        </div>
        <form id="add-user-form" style="display:flex;flex-direction:column;gap:20px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div><label class="form-label">First Name</label><input type="text" class="form-input" id="add-user-first-name" placeholder="Enter first name" required></div>
            <div><label class="form-label">Last Name</label><input type="text" class="form-input" id="add-user-last-name" placeholder="Enter last name" required></div>
          </div>
          <div><label class="form-label">Email Address</label><input type="email" class="form-input" id="add-user-email" placeholder="user@company.com" required></div>
          <div><label class="form-label">Employee ID</label><input type="text" class="form-input" id="add-user-employee-id" placeholder="Enter employee ID" required></div>
          <div><label class="form-label">Department</label><input type="text" class="form-input" id="add-user-department" placeholder="Enter department"></div>
          <div><label class="form-label" for="add-user-role">Role</label><select class="form-input" id="add-user-role" required></select></div>
          <div>
            <label class="form-label">Assign Manager</label>
            <select class="form-input" id="add-user-manager">
              <option value="">Select a manager...</option>
            </select>
          </div>
          <div>
            <label class="form-label">Temporary Password</label>
            <input type="password" class="form-input" id="add-user-password" placeholder="Set temporary password" required>
            <p style="font-size:0.75rem;color:var(--text-secondary);margin-top:6px;">User will be asked to change password on first login</p>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('add-user-modal')">Cancel</button>
        <button class="btn btn-primary" id="add-user-submit" type="submit" form="add-user-form">Add User</button>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/state.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/config-manager/dashboard.js"></script>
  <script src="../../js/pages/config-manager/manage-users.js"></script>
</body>
</html>

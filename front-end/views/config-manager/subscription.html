<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Management - FinStack</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <script src="../../js/app.js"></script>

</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topnav"></header>
  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-text">
          <h1>Subscription Management</h1>
          <p>Manage your FinStack platform subscription and billing</p>
        </div>
      </div>

      <!-- Current Subscription Banner -->
      <div id="current-subscription-container" style="display: none;">
        <div class="card" style="padding: 16px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between;">
          <div>
            <h3 style="margin:0 0 4px 0" id="current-plan-name">Loading...</h3>
            <p style="margin:0;font-size:14px;color:var(--text-secondary);" id="current-plan-interval">Loading...</p>
          </div>
          <div style="text-align: right;">
            <span class="badge" id="current-plan-status">LOADING</span>
            <p style="margin:6px 0 0;font-size:12px;color:var(--text-secondary);" id="current-plan-dates"></p>
          </div>
        </div>
      </div>

      <!-- Plan Selection Grid -->
      <h2 style="font-size: 1.25rem; margin-bottom: 16px;">Available Plans</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;" id="plans-container">
        <!-- Plans dynamically injected here -->
        <p style="color:var(--text-secondary)">Loading available plans...</p>
      </div>

    </div>
  </main>

  <!-- Confirm Action Modal -->
  <div class="modal-overlay" id="action-modal">
    <div class="modal-content" style="max-width: 450px;">
      <div class="modal-header">
        <h3 id="action-modal-title">Confirm Action</h3>
      </div>
      <div class="modal-body">
        <p id="action-modal-message" style="color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5;">Are you sure?</p>
      </div>
      <div class="modal-footer" style="display: flex; gap: 12px; justify-content: flex-end;">
        <button class="btn btn-secondary" onclick="closeModal('action-modal')">Cancel</button>
        <button class="btn btn-primary" id="action-modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/state.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/config-manager/dashboard.js"></script>
  <script src="../../js/pages/config-manager/subscription.js"></script>
</body>
</html>

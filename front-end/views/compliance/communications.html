<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compliance Officer Dashboard</title>  <link rel="stylesheet" href="../../css/actors/compliance.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('finstack-sidebar-collapsed');
      if (saved === 'true') {
        document.documentElement.classList.add('sidebar-collapsed-init');
      }
    })();
  </script>
</head>

<body data-page="communications">

  <div id="sidebar-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;"></div>
  <div id="overlay" class="overlay" onclick="closeAllPanels()"></div>

  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon"><span>F</span></div>
          <span class="sidebar-logo-text">FinStack</span>
        </div>
        <button id="sidebar-collapse-btn" class="sidebar-collapse-btn" type="button" aria-label="Collapse sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item" data-page="dashboard" onclick="Router.navigate('dashboard')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          Dashboard
        </button>
        <button class="nav-item" data-page="escalated" onclick="Router.navigate('escalated')" id="nav-escalated">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          Escalated Expenses
          <span id="escalated-nav-badge" style="display:none;margin-left:auto;min-width:18px;height:18px;padding:0 4px;background:#ef4444;color:#fff;border-radius:999px;font-size:10px;font-weight:700;align-items:center;justify-content:center;"></span>
        </button>
        <button class="nav-item" data-page="policies" onclick="Router.navigate('policies')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
          </svg>
          Policies
        </button>
        <button class="nav-item" data-page="audit" onclick="Router.navigate('audit')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          Audit Logs
        </button>
        <button class="nav-item" data-page="compliance" onclick="Router.navigate('compliance')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" />
          </svg>
          Policy Violations
        </button>
        <button class="nav-item" data-page="communications" onclick="Router.navigate('communications')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            <circle cx="19" cy="7" r="3" fill="#22d3ee" stroke="#111827" stroke-width="2" />
          </svg>
          Notifications
        </button>
        <button class="nav-item" data-page="profile" onclick="Router.navigate('profile')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="7" r="4" />
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          </svg>
          Profile / Settings
        </button>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-logout" onclick="logoutToSharedLogin()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-wrap">
      <header class="header">
        <div class="header-left">
          <button id="mobile-menu-btn" class="mobile-menu-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div class="header-brand">FinStack Workspace</div>
        </div>
        <div class="header-search-wrap">
          <div class="header-search">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <input type="text" placeholder="Search..." aria-label="Search workspace" />
          </div>
        </div>
        <div class="header-actions">
          <button class="header-btn" onclick="Router.navigate('communications')">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="badge"></span>
          </button>
          <div class="header-profile-wrap">
            <button class="header-profile" type="button" data-profile-menu-trigger aria-haspopup="menu"
              aria-expanded="false">
              <span class="header-profile-avatar">HV</span>
              <span class="header-profile-copy">
                <span class="header-profile-name">Hari Vamsi</span>
                <span class="header-profile-email">hari.vamsi@finstack.io</span>
              </span>
              <svg class="header-profile-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </button>
            <div class="header-profile-menu" data-profile-menu role="menu" aria-hidden="true">
              <div class="header-profile-menu-head">
                <div class="header-profile-menu-name">Hari Vamsi</div>
                <div class="header-profile-menu-email">hari.vamsi@finstack.io</div>
              </div>
              <button type="button" class="header-profile-menu-item" role="menuitem"
                onclick="Router.navigate('profile')">Profile Settings</button>
              <button type="button" class="header-profile-menu-item" role="menuitem"
                onclick="Router.navigate('profile')">Preferences</button>
              <div class="header-profile-menu-divider"></div>
              <button type="button" class="header-profile-menu-item logout" role="menuitem"
                onclick="logoutToSharedLogin()">Logout</button>
            </div>
          </div>
        </div>
      </header>

      <main class="page-content">

        <div id="page-communications" class="page active">
          <section class="notifications-page">
            <div class="notifications-topbar">
              <div>
                <h1 class="page-title notifications-title" style="display:flex;align-items:center;gap:10px;">Notifications <span id="notif-badge" style="display:none;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--purple,#7c3aed);color:#fff;font-weight:700;"></span></h1>
                <p class="notifications-subtitle">Stay updated on expense activities and alerts</p>
              </div>
              <div class="notifications-actions">
                <button class="btn btn-secondary notifications-action-btn" type="button" onclick="markAllRead()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                  Mark All as Read
                </button>
                <button class="btn btn-secondary notifications-action-btn" type="button"
                  onclick="clearAllNotifications()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    <line x1="10" y1="11" x2="10" y2="17" />
                    <line x1="14" y1="11" x2="14" y2="17" />
                  </svg>
                  Clear All
                </button>
              </div>
            </div>

            <div class="notifications-tabs" id="notifications-tabs">
              <button class="notifications-tab active" type="button" data-tab="all"
                onclick="setNotificationsTab('all')">All <span class="notifications-tab-count"
                  id="tab-count-all">0</span></button>
              <button class="notifications-tab" type="button" data-tab="pending"
                onclick="setNotificationsTab('pending')">Pending <span class="notifications-tab-count"
                  id="tab-count-pending">0</span></button>
              <button class="notifications-tab" type="button" data-tab="high_risk"
                onclick="setNotificationsTab('high_risk')">High Risk <span class="notifications-tab-count"
                  id="tab-count-high_risk">0</span></button>
              <button class="notifications-tab" type="button" data-tab="approved"
                onclick="setNotificationsTab('approved')">Approved <span class="notifications-tab-count"
                  id="tab-count-approved">0</span></button>
              <button class="notifications-tab" type="button" data-tab="rejected"
                onclick="setNotificationsTab('rejected')">Rejected <span class="notifications-tab-count"
                  id="tab-count-rejected">0</span></button>
            </div>

            <div class="notifications-feed" id="notifications-feed"></div>
            <div class="notifications-empty hidden" id="notifications-empty">
              <div class="notifications-empty-title">No notifications found</div>
              <div class="notifications-empty-copy">This filter is clear right now.</div>
            </div>
          </section>

          <div id="comms-detail-area" class="hidden">
          </div>
        </div><!-- /page-communications -->


      </main>
    </div>
  </div>
  <script src="../../js/api.js"></script>
  <script src="../../js/state.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/pages/compliance/dashboard.js"></script>
  <script src="../../js/pages/compliance/communications.js"></script>

</body>

</html>

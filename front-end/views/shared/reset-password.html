<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set a new password for your FinStack account">
  <title>Reset Password - FinStack</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <script src="../../js/app.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-glow auth-glow-purple"></div>
    <div class="auth-glow auth-glow-cyan"></div>
    <div class="auth-card">
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px;">
        <div class="sidebar-logo-icon" style="width:40px;height:40px;"><span style="font-size:1.125rem;">F</span></div>
        <span style="font-size:1.5rem;font-weight:600;color:white;">FinStack</span>
      </div>
      <div class="auth-card-inner">
        <div id="form-view">
          <div style="text-align:center;margin-bottom:32px;">
            <h1 style="font-size:1.5rem;margin-bottom:8px;">Set New Password</h1>
            <p style="font-size:0.875rem;color:var(--text-secondary);">Create a new secure password for your account.</p>
          </div>
          <form id="reset-form" style="display:flex;flex-direction:column;gap:20px;">
            <div>
              <label class="form-label">New Password</label>
              <div style="position:relative;">
                <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" style="width:18px;height:18px;" width="18px" height="18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" class="form-input has-icon has-icon-right" placeholder="Enter new password" required id="new-pw">
                <button type="button" class="input-icon-right" onclick="togglePw('new-pw','icon1')" style="cursor:pointer;background:none;border:none;">
                  <svg xmlns="http://www.w3.org/2000/svg" id="icon1" style="width:18px;height:18px;color:var(--text-secondary);" width="18px" height="18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <p style="font-size:0.75rem;color:var(--text-secondary);margin-top:6px;">Must be at least 8 characters long</p>
            </div>
            <div>
              <label class="form-label">Confirm Password</label>
              <div style="position:relative;">
                <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" style="width:18px;height:18px;" width="18px" height="18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" class="form-input has-icon has-icon-right" placeholder="Confirm new password" required id="confirm-pw">
                <button type="button" class="input-icon-right" onclick="togglePw('confirm-pw','icon2')" style="cursor:pointer;background:none;border:none;">
                  <svg xmlns="http://www.w3.org/2000/svg" id="icon2" style="width:18px;height:18px;color:var(--text-secondary);" width="18px" height="18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div id="error-msg" style="display:none;padding:12px;border-radius:var(--radius-lg);background:var(--red-bg);border:1px solid var(--red);color:var(--red);font-size:0.875rem;"></div>
            <button type="submit" class="btn btn-primary btn-full" style="padding:12px;margin-top:8px;">Reset Password <svg xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;" width="18px" height="18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
          </form>
          <div style="margin-top:24px;text-align:center;">
            <a href="../../login.html" style="font-size:0.875rem;font-weight:500;color:var(--purple);">Back to Login</a>
          </div>
        </div>
        <div id="success-view" style="display:none;">
          <div style="text-align:center;padding:32px 0;">
            <div class="success-icon success-icon-purple" style="margin-bottom:24px;">
              <svg xmlns="http://www.w3.org/2000/svg" style="width:32px;height:32px;" width="32px" height="32px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
            </div>
            <h2 style="font-size:1.5rem;font-weight:600;color:var(--text-primary);margin-bottom:12px;">Password Updated!</h2>
            <p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:32px;">Your password has been successfully updated. You can now log in.</p>
            <a href="../../login.html" class="btn btn-primary btn-full" style="padding:12px;">Go to Login <svg xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;" width="18px" height="18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
          </div>
        </div>
      </div>
      <div style="margin-top:32px;text-align:center;">
        <a href="../../index.html" style="font-size:0.875rem;color:var(--text-secondary);">← Back to home</a>
      </div>
    </div>
  </div>
  
  <script src="../../js/pages/shared/reset-password.js"></script>
</body>
</html>

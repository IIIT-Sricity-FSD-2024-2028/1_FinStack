<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FinStack</title>    <link rel="stylesheet" href="../../css/actors/submitter.css">
    <script>
        (function () {
            const saved = localStorage.getItem('finstack-sidebar-collapsed');
            if (saved === 'true') {
                document.documentElement.classList.add('sidebar-collapsed-init');
            }
        })();
    </script>
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon"><span>F</span></div>
                    <span class="sidebar-logo-text">FinStack</span>
                </div>
                <button id="sidebar-collapse-btn" class="sidebar-collapse-btn" type="button"
                    aria-label="Collapse sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="7" height="9" x="3" y="3" rx="1" />
                        <rect width="7" height="5" x="14" y="3" rx="1" />
                        <rect width="7" height="9" x="14" y="12" rx="1" />
                        <rect width="7" height="5" x="3" y="16" rx="1" />
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="submit.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 8v8" />
                        <path d="M8 12h8" />
                    </svg>
                    <span>Submit Expense</span>
                </a>
                <a href="expenses.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" />
                        <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
                        <path d="M12 17.5V6.5" />
                    </svg>
                    <span>My Expenses</span>
                </a>
                <a href="status.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                    </svg>
                    <span>Track Expense Status</span>
                </a>
                <a href="reports.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3v18h18" />
                        <path d="m19 9-5 5-4-4-3 3" />
                    </svg>
                    <span>AI Validation &amp; Risk Reports</span>
                </a>
                <a href="notifications.html" class="sidebar-link" style="position:relative;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
                    </svg>
                    <span>Notifications</span>
                    <span id="notif-sidebar-badge" class="dot" style="display:none;position:absolute;right:12px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--indigo-400);"></span>
                </a>
                <a href="profile-settings.html" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="7" r="4" />
                        <path d="M5.5 21a6.5 6.5 0 0 1 13 0" />
                    </svg>
                    <span>Profile &amp; Settings</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="sidebar-logout" id="logoutBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <div class="main-wrapper">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <span class="topbar-title" style="white-space:nowrap;">FinStack Workspace</span>
                    <div class="topbar-search">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                        <input type="text" placeholder="Search...">
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="topbar-bell">
                        <span class="dot"></span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
                        </svg>
                    </button>
                    <div class="topbar-user">
                        <div class="topbar-avatar">HR</div>
                        <div class="topbar-user-info">
                            <span class="topbar-user-name">Harshith Rekapalli</span>
                            <span class="topbar-user-role">expense submitter</span>
                        </div>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" style="color:#71717a;flex-shrink:0;">
                            <path d="m6 9 6 6 6-6" />
                        </svg>
                    </div>
                </div>
            </header>

            <main class="main-content animate-in">
                <div class="dashboard-head">
                    <h1 class="text-2xl font-semibold text-white">Expense Submitter Dashboard</h1>
                    <button class="btn btn-primary" onclick="location.href='submit.html'">+ New Expense</button>
                </div>

                <!-- KPI Cards -->
                <div class="kpi-grid" id="kpiGrid"></div>

                <!-- Charts Row -->
                <div class="charts-row">
                    <div class="card chart-area-card">
                        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
                            <span class="card-title">Expense Trends</span>
                            <select class="form-select"
                                style="width:auto;padding:6px 12px;font-size:13px;border-radius:8px;">
                                <option>Last 7 months</option>
                                <option>This Year</option>
                            </select>
                        </div>
                        <div class="card-content" style="padding:0 24px 24px;">
                            <div style="height:300px;"><canvas id="trendChart"></canvas></div>
                        </div>
                    </div>
                    <div class="card chart-bar-card">
                        <div class="card-header"><span class="card-title">Spend by Category</span></div>
                        <div class="card-content" style="padding:0 24px 24px;">
                            <div style="height:220px;"><canvas id="categoryChart"></canvas></div>
                            <div class="category-legend" id="categoryLegend"></div>
                        </div>
                    </div>
                </div>

                <!-- Recent Transactions -->
                <div class="card">
                    <div class="card-header"
                        style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:16px;">
                        <span class="card-title">Recent Transactions</span>
                        <a href="expenses.html"
                            style="font-size:14px;font-weight:500;color:var(--indigo-400);transition:color 0.15s;">View
                            All</a>
                    </div>
                    <div class="card-content p-0">
                        <div id="recentTransactions"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../../js/api.js"></script>
  <script src="../../js/state.js"></script>
    <script src="../../js/auth.js"></script>
    
    <script src="../../js/pages/submitter/dashboard.js"></script>
</body>

</html>
